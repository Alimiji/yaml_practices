name: Afficher le poème

on:
  push:
    branches: [ main ]

jobs:
  show-poem:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Afficher literal.yml brut
        run: |
          echo "Contenu brut de literal.yml :"
          cat literal.yml

      - name: Afficher seulement le poème (contenu)
        run: |
          python - << 'EOF'
          import yaml

          with open("literal.yml", "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          print("Nom :", data["nom"])
          print("Signature :", data["signature"])
          print("Poème :")
          print(data["contenu"])
          EOF
